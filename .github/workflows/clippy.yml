name: Release checks

on: [push, pull_request]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --all-features --locked
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo doc --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo package --list
      - run: cargo publish --dry-run --all-features --locked

  feature-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tls: [native-tls, native-tls-vendored, rustls-tls-native-roots, rustls-tls-webpki-roots]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Check the library with exactly the requested exchange and TLS features.
      - run: cargo check --lib --no-default-features --features bitbank,${{ matrix.tls }} --locked
      - run: cargo check --lib --no-default-features --features full,${{ matrix.tls }} --locked
