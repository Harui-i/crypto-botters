[workspace]
exclude = ["generic-api-client"]

[package]
name = "crypto-botters-bitbank"
version = "0.7.0"
authors = ["negi_grass", "Harui-i"]
edition = "2021"
description = "A fork of crypto-botters with bitbank REST and WebSocket API support."
license = "MIT"
readme = "README.md"
homepage = "https://github.com/Harui-i/crypto-botters"
documentation = "https://docs.rs/crypto-botters-bitbank"
repository = "https://github.com/Harui-i/crypto-botters"
keywords = ["cryptocurrency", "finance", "trading", "client", "websocket"]
categories = ["api-bindings", "asynchronous", "cryptography::cryptocurrencies", "authentication"]
autoexamples = false
exclude = ["/.idea", "/.github"]

[lib]
name = "crypto_botters"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["native-tls"]

full = ["binance", "bitbank", "bitflyer", "bybit", "coincheck"]
binance = ["dep:serde_urlencoded"]
bitflyer = ["dep:rand"]
bybit = ["dep:serde_urlencoded", "dep:rand"]
coincheck = ["dep:serde_urlencoded"]
bitbank = []

native-tls = ["generic-api-client/native-tls"]
native-tls-vendored = ["generic-api-client/native-tls-vendored"]
rustls-tls-native-roots = ["generic-api-client/rustls-tls-native-roots"]
rustls-tls-webpki-roots = ["generic-api-client/rustls-tls-webpki-roots"]

[dependencies]
generic-api-client = "0.3"
serde = { version = "1.0.193", features = ["derive"] }
serde_json = "1.0.108"
hmac = "0.12.1"
sha2 = "0.10.8"
hex = "0.4.3"
log = "0.4.20"
serde_urlencoded = { version = "0.7.1", optional = true }
rand = { version = "0.8.5", optional = true }

[dev-dependencies]
reqwest = { version = "0.11.22", default-features = false }
tokio-tungstenite = "0.21.0"
futures-util = "0.3.29"
tokio = { version = "1.34.0", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
rust_decimal = { version = "1.33.0", features = ["serde-with-str", "serde-with-float"] }
env_logger = "0.10.1"

